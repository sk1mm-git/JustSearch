<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustMC • Справочник блоков</title>
    <!-- Пиксельный шрифт с поддержкой кириллицы -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-layer" id="bgParallax">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
</div>

<div class="container">
    <header class="header">
        <div class="logo">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            </div>
            <div class="logo-text">
                <h1>JustMC <span>Справочник</span></h1>
                <p>Блоки кода • действия • события • значения</p>
            </div>
        </div>
        <button class="sound-toggle" id="soundToggle" title="Включить/выключить звук">
            <span class="sound-icon">🔊</span>
        </button>
    </header>

    <div class="status-bar" aria-label="Статус загрузки данных">
        <div class="status-badge" id="statusActions"><span class="status-dot"></span> Действия</div>
        <div class="status-badge" id="statusEvents"><span class="status-dot"></span> События</div>
        <div class="status-badge" id="statusValues"><span class="status-dot"></span> Значения</div>
    </div>

    <div class="controls">
        <div class="tab-switcher" id="tabSwitcher" role="tablist" aria-label="Разделы справочника">
            <button class="tab-btn active" data-tab="actions" role="tab"><span>⚙️</span> Действия</button>
            <button class="tab-btn" data-tab="events" role="tab"><span>📡</span> События</button>
            <button class="tab-btn" data-tab="values" role="tab"><span>🔢</span> Значения</button>
        </div>
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Поиск... (Ctrl+K)">
            <kbd class="search-kbd">Ctrl K</kbd>
        </div>
    </div>

    <div class="nav-bar">
        <div class="breadcrumbs hidden" id="breadcrumbs"></div>
        <button class="back-btn hidden" id="backBtn" title="Вернуться на уровень выше">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Назад
        </button>
    </div>

    <div id="contentArea">
        <div class="loading" id="loadingState">
            <div class="loader"></div>
            <p>Загрузка данных и локализации...</p>
        </div>
        <div id="errorState" class="error-msg hidden"></div>

        <section id="categoriesSection" class="level hidden">
            <div class="level-head">
                <h2>Категории</h2>
                <p>Выберите раздел, чтобы увидеть блоки</p>
            </div>
            <div id="categoriesView" class="categories-grid"></div>
        </section>

        <section id="subcategoriesSection" class="level hidden">
            <div class="level-head">
                <h2 id="subcategoriesTitle">Субкатегории</h2>
                <p>Выберите подраздел, чтобы увидеть блоки</p>
            </div>
            <div id="subcategoriesView" class="subcategories-grid"></div>
        </section>

        <section id="itemsSection" class="level hidden">
            <div class="level-head">
                <h2 id="itemsTitle">Блоки</h2>
                <p id="itemsSubtitle">Список блоков выбранного раздела</p>
            </div>
            <div class="items-toolbar">
                <span class="items-count" id="itemsCount">0 шт.</span>
            </div>
            <div id="itemsList" class="items-list"></div>
        </section>
    </div>
</div>

<button class="scroll-top hidden" id="scrollTop" title="Наверх">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
</button>

<!-- Модальное окно -->
<div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose" title="Закрыть">✕</button>
        <div class="modal-header">
            <div class="modal-icon-wrap" id="modalIconWrap">
                <img class="modal-icon hidden" id="modalIcon" alt="">
                <div class="modal-icon-letter hidden" id="modalIconLetter"></div>
            </div>
            <div class="modal-title-wrap">
                <h2 id="modalTitle">Название</h2>
                <div class="modal-id" id="modalId">id</div>
            </div>
        </div>
        <div class="modal-tabs">
            <button class="modal-tab active" data-tab="info">Информация</button>
            <button class="modal-tab" data-tab="locale">Локализация</button>
            <button class="modal-tab" data-tab="json">JSON</button>
        </div>
        <div class="modal-body">
            <div id="modalInfo" class="modal-panel"></div>
            <div id="modalLocale" class="modal-panel hidden"></div>
            <div id="modalJson" class="modal-panel hidden"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
